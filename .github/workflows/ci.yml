name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '30 20 * * *'   # nightly (02:00 IST)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Unit tests (no browser, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:unit

  e2e:
    name: E2E shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    needs: [static-checks, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble   # keep in sync with package.json
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    env:
      HOME: /root
      ON_BOT_CHECK: skip        # CAPTCHA on a datacenter IP = skipped + annotated, not "failed"
      # Optional secrets. Absent (e.g. forks) => account tests are simply not registered.
      AMAZON_STORAGE_STATE_B64: ${{ secrets.AMAZON_STORAGE_STATE_B64 }}
      AMAZON_ADDRESS_NAME: ${{ secrets.AMAZON_ADDRESS_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Run E2E (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        # @exploratory tests (random home-page feed) run nightly only
        run: >
          npx playwright test --project=public --project=setup --project=account
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
          ${{ github.event_name != 'schedule' && '--grep-invert @exploratory' || '' }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: test-results
          retention-days: 7

  merge-reports:
    name: Merge HTML report
    if: ${{ !cancelled() }}
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report
          retention-days: 14
